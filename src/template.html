<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div id="nav">
        <h1>Weather App</h1>
        <div id="nav-center">
            <form id="weatherForm">
                <label for="cityName" id="nav-label">City:</label>
                <input type="text" id="cityName" placeholder="london">
                <button type="submit" id="submit-btn">Submit</button>
            </form>
            <button id="change-C-btn">Change to °C</button>
            <button id="change-F-btn">Change to °F</button>
        </div>    
        <img src="../images/sun.svg" alt="sun image" width="24">
    </div>
    <div id="container">
        <div id="city" class="element" data-label="📍 LOCATION"></div>
        <div id="temperature" class="element" data-label="🌡️ TEMPERATURE"></div>
        <div id="conditions" class="element" data-label="☁️ CONDITIONS"></div>
        <div id="humidity" class="element" data-label="💧 HUMIDITY"></div>
    </div>
</body>
</html>
